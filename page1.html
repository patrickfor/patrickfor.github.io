<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Shanii 💖</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffeef6,#fff8fb);
overflow:hidden;
text-align:center;
}

h1{
color:#ff4f8b;
margin-top:30px;
}

p{
color:#555;
}

.container{
padding:20px;
}

button{
background:#ff5f9e;
color:white;
border:none;
padding:15px 28px;
margin:10px;
border-radius:40px;
cursor:pointer;
font-size:17px;
transition:.3s;
}

button:hover{
transform:scale(1.08);
background:#ff3b86;
}

#popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:30px;
width:90%;
max-width:450px;
border-radius:25px;
animation:pop .5s;
}

@keyframes pop{
from{transform:scale(.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

#gift{
font-size:70px;
cursor:pointer;
animation:bounce 1.3s infinite;
}

@keyframes bounce{
50%{transform:translateY(-15px);}
}

#star{
font-size:60px;
cursor:pointer;
position:absolute;
}

#result{
font-size:22px;
color:#ff4f8b;
font-weight:bold;
margin-top:20px;
}

.heart{
position:absolute;
font-size:20px;
animation:float 7s linear infinite;
opacity:.7;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-120px);}
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Hi, My Beautiful Shanii 🌸</h1>

<p>
I made this little page just for you.
Every click hides a surprise because you deserve lots of smiles today. 💕
</p>

<button onclick="letter()">💌 Read My Letter</button>
<button onclick="compliment()">🌷 Random Compliment</button>

<h2>🎁 Open My Gift</h2>
<div id="gift" onclick="gift()">🎁</div>

<h2>⭐ Catch the Lucky Star</h2>
<p>Catch it 8 times!</p>

<div id="star">⭐</div>

<div id="result">Stars: 0 / 8</div>

</div>

<div id="popup">
<div class="card">
<h2 id="title"></h2>
<p id="text"></p>
<button onclick="closePopup()">Close ❤️</button>
</div>
</div>

<script>

for(let i=0;i<40;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*5)+"s";
h.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(h);
}

function openPopup(title,text){
document.getElementById("popup").style.display="flex";
document.getElementById("title").innerHTML=title;
document.getElementById("text").innerHTML=text;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function letter(){
openPopup(
"💖 A Letter For You 💖",
"Hi, my beautiful Shanii.<br><br>I hope you never forget how amazing you are. Your beauty catches my eyes, your kindness touches my heart, and your intelligence inspires me. Even your cute little clumsy moments make me smile because they're part of what makes you uniquely you.<br><br>I'm so excited to see you. I keep imagining your smile, hearing your laugh, and spending time together. Until that day comes, always remember that someone is thinking about you every single day.<br><br>I love you so much. ❤️<br><br>Love,<br><b>Patrick</b>"
);
}

const compliments=[
"🌸 You're prettier than every flower.",
"💕 Your smile is my favorite view.",
"🥰 You're cute even when you're clumsy.",
"✨ You're the smartest girl I know.",
"❤️ My favorite place is wherever you are.",
"🌷 You make ordinary days feel special."
];

function compliment(){
let c=compliments[Math.floor(Math.random()*compliments.length)];
openPopup("Random Compliment",c);
}

function gift(){
openPopup("🎁 Surprise!","Inside this gift is one million hugs, one million kisses, and one heart that belongs to you forever. ❤️");
}

let score=0;
const star=document.getElementById("star");

move();

star.onclick=function(){
score++;
document.getElementById("result").innerHTML="Stars: "+score+" / 8";

if(score>=8){
openPopup("🌟 You Won!","Congratulations, my love! You caught all the stars... but you'll never catch how much I love you. I can't wait to see you. ❤️");
score=0;
document.getElementById("result").innerHTML="Stars: 0 / 8";
}
move();
}

function move(){
star.style.left=Math.random()*80+"vw";
star.style.top=(250+Math.random()*250)+"px";
}

</script>

</body>
</html>
