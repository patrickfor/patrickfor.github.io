<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Shanii ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#ffeaf4,#fff7fb);
overflow:hidden;
text-align:center;
}

h1{
margin-top:25px;
color:#ff3b84;
}

p{
color:#555;
margin:10px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff5b99;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.card{
margin:20px auto;
width:90%;
max-width:500px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* Hearts */
.heart{
position:absolute;
font-size:22px;
animation:float 7s linear infinite;
opacity:.7;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-120px);}
}

/* Popup */

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
}

.popupBox{
background:white;
padding:30px;
width:90%;
max-width:420px;
border-radius:20px;
animation:pop .4s;
}

@keyframes pop{
from{transform:scale(.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* Game 1 */

#heartBtn{
font-size:60px;
cursor:pointer;
position:absolute;
transition:.25s;
}

/* Game 2 */

.choice{
display:flex;
justify-content:center;
gap:15px;
margin-top:15px;
flex-wrap:wrap;
}

.choice button{
background:#ff7aad;
}

</style>
</head>

<body>

<h1>💖 Hi My Beautiful Shanii 💖</h1>

<p>
Complete the two games to unlock my secret letter.
</p>

<div class="card">

<h2>🎯 Game 1</h2>
<p>Catch my heart 10 times.</p>

<div id="score">
❤️ 0 / 10
</div>

</div>

<div id="heartBtn">❤️</div>

<div class="card">

<h2>🌸 Game 2</h2>

<p>
Which gift would you choose?
</p>

<div class="choice">

<button onclick="gift('flowers')">
🌹 Flowers
</button>

<button onclick="gift('hug')">
🤗 Hug
</button>

<button onclick="gift('date')">
🍰 Date
</button>

</div>

</div>

<div class="popup" id="popup">

<div class="popupBox">

<h2 id="title"></h2>

<p id="message"></p>

<button onclick="closePopup()">
Close ❤️
</button>

</div>

</div>

<script>

/* Floating Hearts */

for(let i=0;i<35;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="💕";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*5)+"s";

h.style.fontSize=(15+Math.random()*20)+"px";

document.body.appendChild(h);

}

/* Popup */

function popup(title,msg){

document.getElementById("popup").style.display="flex";

document.getElementById("title").innerHTML=title;

document.getElementById("message").innerHTML=msg;

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

/* Game 1 */

let score=0;

const heart=document.getElementById("heartBtn");

moveHeart();

heart.onclick=function(){

score++;

document.getElementById("score").innerHTML="❤️ "+score+" / 10";

moveHeart();

if(score==10){

popup("🎉 You Did It! ❤️",

"Congratulations, my love! You caught all my hearts... but you'll never catch how much I love you.<br><br>Hi Shanii... You're beautiful, smart, kind, and even your little clumsy moments make me smile. I'm so excited to see you. I can't wait to see your beautiful smile, hear your laugh, and spend time with you. I love you so much. ❤️<br><br>- Patrick");

score=0;

document.getElementById("score").innerHTML="❤️ 0 / 10";

}

}

function moveHeart(){

heart.style.left=Math.random()*80+"vw";

heart.style.top=(180+Math.random()*300)+"px";

}

/* Game 2 */

function gift(type){

if(type=="flowers"){

popup("🌹 Flowers",

"These flowers are beautiful... but not as beautiful as you. ❤️");

}

if(type=="hug"){

popup("🤗 Virtual Hug",

"Imagine this button giving you the biggest hug ever. I wish I could hug you in person soon. 🥹❤️");

}

if(type=="date"){

popup("🍰 Our Future Date",

"I can't wait for the day we go on another date together. I'll be smiling the entire time because I'll be with you. ❤️");

}

}

</script>

</body>
  </html>
